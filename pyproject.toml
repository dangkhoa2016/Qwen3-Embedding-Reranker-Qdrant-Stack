[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-dual-4b-cpu-rest-server"
version = "0.1.1"
description = "CPU Qwen3 embedding and reranking REST service"
requires-python = ">=3.10"
dependencies = [
  "transformers>=4.51.0,<5",
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "psutil>=6,<8",
  "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
