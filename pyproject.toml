[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-dual-4b-cpu-rest-server"
version = "1.0.0"
description = "Local CPU REST service for Qwen3 embeddings and reranking with a qualified Qdrant 20K Kaggle demo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Đăng Khoa", email = "i.am@dangkhoa.dev" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "qwen3",
  "embedding",
  "reranking",
  "qdrant",
  "fastapi",
  "cpu",
  "gguf",
  "llama.cpp",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "transformers>=4.51.0,<5",
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "psutil>=6,<8",
  "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
