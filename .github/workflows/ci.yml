name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict_manifest:
        description: "Verify frozen source hashes against MANIFEST.sha256"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-dev.txt

      - name: Validate source manifest structure and coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          manifest = Path("MANIFEST.sha256")
          assert manifest.is_file(), "MANIFEST.sha256 is missing"
          entries, seen = [], set()
          for lineno, raw in enumerate(manifest.read_text(encoding="utf-8").splitlines(), 1):
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
              assert match, f"invalid MANIFEST.sha256 line {lineno}: {raw!r}"
              _, path = match.groups()
              assert path not in seen, f"duplicate manifest path: {path}"
              assert Path(path).is_file(), f"manifest path does not exist: {path}"
              seen.add(path)
              entries.append(path)
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          expected = tracked - {"MANIFEST.sha256"}
          assert seen == expected, (
              f"manifest coverage mismatch; missing={sorted(expected - seen)}, "
              f"extra={sorted(seen - expected)}"
          )
          print(f"MANIFEST_STRUCTURE={len(entries)}/{len(expected)} PASS")
          PY

      - name: Verify frozen source manifest hashes
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.strict_manifest)
        run: sha256sum -c MANIFEST.sha256

      - name: Compile Python sources
        run: python -m compileall -q src scripts tools tests

      - name: Validate shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts tools -type f -name '*.sh' -print0)

      - name: Run full regression suite
        env:
          PYTHONPATH: src
        run: pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          python -m build

      - name: Verify distribution metadata and contents
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import zipfile
          dist = Path("dist")
          wheel = next(dist.glob("qwen3_embedding_reranker_qdrant_stack-1.0.0-*.whl"))
          sdist = dist / "qwen3_embedding_reranker_qdrant_stack-1.0.0.tar.gz"
          assert sdist.is_file(), sdist
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(zf.read(metadata_name).decode("utf-8"))
              assert metadata["Name"] == "qwen3-embedding-reranker-qdrant-stack"
              assert metadata["Version"] == "1.0.0"
              assert metadata["License-Expression"] == "MIT"
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in zf.namelist())
          with tarfile.open(sdist, "r:gz") as tf:
              names = set(tf.getnames())
              prefix = "qwen3_embedding_reranker_qdrant_stack-1.0.0/"
              for path in [
                  "README.md", "README.vi.md",
                  "SECURITY.md", "SECURITY.vi.md",
                  "CONTRIBUTING.md", "CONTRIBUTING.vi.md",
                  "LICENSE",
              ]:
                  assert prefix + path in names, path
          PY

      - name: Upload canonical tag distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qwen3-embedding-reranker-qdrant-stack-${{ github.ref_name }}-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
