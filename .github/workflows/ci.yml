name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-dev.txt

      - name: Verify source manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Compile Python sources
        run: python -m compileall -q src scripts tools

      - name: Validate shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts tools -type f -name '*.sh' -print0)

      - name: Run blocking regression suite
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            --deselect=tests/test_engine_contracts.py::test_embedding_loader_is_cpu_fp16_low_memory_and_output_is_fp32 \
            --deselect=tests/test_engine_contracts.py::test_reranker_uses_yes_no_protocol_and_sorts_results \
            --deselect=tests/test_engine_contracts.py::test_current_transformers_prefers_dtype_keyword

      - name: Run known historical compatibility probes
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_engine_contracts.py::test_embedding_loader_is_cpu_fp16_low_memory_and_output_is_fp32 \
            tests/test_engine_contracts.py::test_reranker_uses_yes_no_protocol_and_sorts_results \
            tests/test_engine_contracts.py::test_current_transformers_prefers_dtype_keyword

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution metadata and contents
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheel = next(dist.glob("qwen3_embedding_reranker_qdrant_stack-1.0.0-*.whl"))
          sdist = dist / "qwen3_embedding_reranker_qdrant_stack-1.0.0.tar.gz"
          assert sdist.is_file(), sdist

          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(zf.read(metadata_name).decode("utf-8"))
              assert metadata["Name"] == "qwen3-embedding-reranker-qdrant-stack"
              assert metadata["Version"] == "1.0.0"
              assert metadata["License-Expression"] == "MIT"
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in zf.namelist())

          with tarfile.open(sdist, "r:gz") as tf:
              names = set(tf.getnames())
              prefix = "qwen3_embedding_reranker_qdrant_stack-1.0.0/"
              for path in ["README.md", "README.vi.md", "SECURITY.md", "SECURITY.vi.md", "CONTRIBUTING.md", "CONTRIBUTING.vi.md", "LICENSE"]:
                  assert prefix + path in names, path
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: qwen3-embedding-reranker-qdrant-stack-1.0.0-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
